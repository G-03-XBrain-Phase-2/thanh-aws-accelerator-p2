apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: lenguyennhatthanh72@gmail.com
      smtp_auth_username: lenguyennhatthanh72@gmail.com
      smtp_auth_password: REPLACE_AT_APPLY_TIME_DO_NOT_COMMIT_REAL_PASSWORD
      smtp_require_tls: true
    route:
      receiver: blackhole
      routes:
        - receiver: personal-email
          matchers:
            - alertname="BackendHighErrorRate"
          group_by:
            - alertname
          group_wait: 10s
          group_interval: 30s
          repeat_interval: 2h
    receivers:
      - name: blackhole
      - name: personal-email
        email_configs:
          - to: lenguyennhatthanh72@gmail.com
            send_resolved: true
