apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-test
  namespace: argocd-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 5
  selector:
    matchLabels:
      app: argocd-test
  template:
    metadata:
      labels:
        app: argocd-test
    spec:
      containers:
        - name: argocd-test
          image: nginx:1.27
          ports:
            - containerPort: 80
    