<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArgoCD Test Frontend</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      main {
        width: min(560px, calc(100vw - 32px));
        padding: 32px;
        border: 1px solid #d7deea;
        border-radius: 8px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Frontend is running</h1>
      <p>This image is served by nginx from the argocd-test frontend container.</p>
    </main>
  </body>
</html>
