apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: demo
  name: developer
rules:
- apiGroups: [""]
  resources:
  - pods
  - configmaps
  - services
  verbs: ["get", "list", "create", "update", "watch", "patch", "delete"]
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs: ["get", "list", "create", "update", "watch", "patch", "delete"]

--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre
rules:
- apiGroups: [""]
  resources: 
  - pods
  - configmaps
  - services
  - pods/log
  - events
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs: ["get", "list", "watch", "delete"]
  
--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: viewer
rules:
- apiGroups: [""]
  resources: 
  - pods
  - configmaps
  - services
  - pods/log
  - events
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
  verbs: ["get", "list", "watch"]

