apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: w10-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/G-03-XBrain-Phase-2/thanh-aws-accelerator-p2/cloud/w10/lab.git
    targetRevision: main
    path: rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true