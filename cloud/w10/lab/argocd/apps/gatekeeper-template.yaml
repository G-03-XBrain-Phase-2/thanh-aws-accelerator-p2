apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: w10-gatekeeper-templates
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/G-03-XBrain-Phase-2/thanh-aws-accelerator-p2.git
    targetRevision: main
    path: cloud/w10/lab/gatekeeper/templates
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true