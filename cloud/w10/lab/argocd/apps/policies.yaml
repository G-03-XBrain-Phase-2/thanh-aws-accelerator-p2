# ArgoCD App: sync image signature policies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/G-03-XBrain-Phase-2/thanh-aws-accelerator-p2.git
    path: cloud/w10/lab/policies
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: cosign-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
