apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-secret
  namespace: w10-day-b
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: app-db-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: w10/day-b/prod/app
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: w10/day-b/prod/app
        property: password