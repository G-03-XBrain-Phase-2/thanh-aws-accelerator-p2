apiVersion: v1
kind: Pod
metadata:
  name: rbac-test
  namespace: w10-rbac
  labels:
    app: rbac-test
    owner: thanh
    environment: dev
spec:
  serviceAccountName: developer-sa
  automountServiceAccountToken: false
  containers:
  - name: nginx
    image: nginx:1.26-alpine
    ports:
      - containerPort: 80
        name: http
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
