apiVersion: v1
kind: Pod
metadata:
  name: quota-good-pod
  namespace: platform-prod
  labels:
    app: quota-good-pod
    environment: prod
spec:
  containers:
    - name: app
      image: nginx:1.26-alpine
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi