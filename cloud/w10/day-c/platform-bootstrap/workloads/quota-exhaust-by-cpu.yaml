apiVersion: v1
kind: Pod
metadata:
  name: quota-exhaust-by-cpu
  namespace: platform-prod
  labels:
    app: quota-exhaust-by-cpu
    environment: prod
spec:
  containers:
    - name: app-1
      image: nginx:1.26-alpine
      resources:
        requests:
          cpu: "1"
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi
    - name: app-2
      image: nginx:1.26-alpine
      resources:
        requests:
          cpu: "1"
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 256Mi