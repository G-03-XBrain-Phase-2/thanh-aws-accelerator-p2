apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-local-lab
  labels:
    app: k8s-local-lab
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-local-lab
      component: api
  template:
    metadata:
      labels:
        app: k8s-local-lab
        component: api
    spec:
      containers:
        - name: app
          image: k8s-local-lab:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: k8s-local-lab-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
